name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Nothing to fetch and no fixture to keep in sync: the suite writes its
      # own .gcs files and its own .gem binaries, the latter from an encoder
      # built off the format notes rather than from the parser under test.
      #
      # GCS_VIEWER_NO_GUI stops the error paths opening a message box.  On a
      # runner that would not fail, it would hang.
      - name: Run tests
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: python test_gcs_viewer.py

      # A green suite only means something if it can go red.  This
      # reintroduces ten known defects and fails if any of them slips past.
      - name: Mutation-check the suite
        if: matrix.python == '3.12'
        run: python scripts/mutation_check.py

      # The committed demo is the README's illustration; regenerating it here
      # proves the generator still matches what is checked in.
      - name: Rebuild the demo stone
        if: matrix.python == '3.12'
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: python scripts/make_demo.py
