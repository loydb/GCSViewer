name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Nothing to fetch and no fixture to keep in sync: the suite writes its
      # own .gcs files and its own .gem binaries, the latter from an encoder
      # built off the format notes rather than from the parser under test.
      #
      # GCS_VIEWER_NO_GUI stops the error paths opening a message box.  On a
      # runner that would not fail, it would hang.
      - name: Run tests
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: python test_gcs_viewer.py

      # Drives the real window with a hand-pumped event loop rather than
      # mainloop(), so it runs unattended.  It skips itself where Tk has no
      # display, which keeps the headless Linux runners green without xvfb.
      - name: Run windowed tests
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: python test_gui.py

      # A green suite only means something if it can go red.  This
      # reintroduces ten known defects and fails if any of them slips past.
      - name: Mutation-check the suite
        if: matrix.python == '3.12'
        run: python scripts/mutation_check.py

      # The committed demo and icon are both drawn by the renderer under test,
      # so regenerating them here proves the generators still run against the
      # current source rather than quietly rotting next to what is checked in.
      - name: Rebuild the demo stone and the icon
        if: matrix.python == '3.12'
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: |
          python scripts/make_demo.py
          python scripts/make_demo_anim.py
          python scripts/gen_icon.py

      # If the generator and the checked-in stone ever part company, the
      # README illustrates something the program no longer produces.
      # Compared as geometry rather than as bytes: a .gcs stores full
      # precision reprs of sin/cos/tan results, and those differ in the last
      # bit between the Windows CRT and glibc, so a byte comparison fails on
      # a different platform for reasons that have nothing to do with this
      # program.  It did exactly that here before this was written.
      - name: The committed demo stone still matches its generator
        if: matrix.python == '3.12'
        env:
          GCS_VIEWER_NO_GUI: "1"
        run: python scripts/check_demo.py
